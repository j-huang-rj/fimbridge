[project]
name = "fimbridge"
version = "0.1.0"
description = "A lightweight, adaptive gateway for Ollama that translates Fill-In-the-Middle (FIM) dialects and optimizes IDE inline code completion."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "python-dotenv>=1.2.1,<2.0.0",
    "fastapi[standard]>=0.129.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.15,<1.0.0",
    "ruff>=0.14.3,<1.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
serve = "app.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ty.environment]
python-version = "3.12"
python = ".venv"
root = ["./app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
